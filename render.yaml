services:
  - type: web
    name: coachladywassa-backend
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        value: "https://www.coachladywassa.com,https://coachladywassa.com"
      # These need to be set MANUALLY in the Render dashboard for security:
      # - MONGO_URL      (your MongoDB Atlas connection string)
      # - DB_NAME        (e.g. coachladywassa_prod)
      # - JWT_SECRET     (any long random string)
      # - ADMIN_EMAIL    (admin@ladywassa.com)
      # - ADMIN_PASSWORD (your strong admin password)
      # - EMERGENT_LLM_KEY (sk-emergent-…)
